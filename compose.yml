services:
  api:
    build:
      context: .
      target: builder
    ports:
      - "3301:3301"
    volumes:
      - ./src:/app/src
    depends_on:
      - db
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: supersecret
    volumes:
      - /var/lib/postgresql
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgres"]
      interval: 30s
      timeout: 60s
      retries: 5