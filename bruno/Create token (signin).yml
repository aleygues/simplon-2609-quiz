info:
  name: Create token (signin)
  type: http
  seq: 3

http:
  method: POST
  url: "{{api}}/users/tokens"
  body:
    type: json
    data: |-
      {
        "email": "{{user1email}}",
        "password": "{{user1password}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("OK is returned", () => {
          const json = res.body;
          expect(json.ok).to.eq(true);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
